<title>Flashcard Knowledge Graph</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d25; --line: #2b3040; --text: #e8eaf0;
    --muted: #98a0b3; --accent: #6ea8fe; --chip: #232734;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --panel: #f7f8fa; --line: #e2e5ec; --text: #1d2129;
      --muted: #6b7280; --accent: #2563eb; --chip: #eef1f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0 6px 0 0; }
  header .stats { color: var(--muted); font-size: 12px; margin-right: auto; }
  input, select, button {
    background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: flex; flex: 1; min-height: 0; }
  #graphwrap { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .edge { stroke: var(--muted); stroke-opacity: .18; }
  .edge.hot { stroke: var(--accent); stroke-opacity: .85; }
  .edge.mute { stroke-opacity: .04; }
  .node { cursor: pointer; }
  .node circle { stroke: var(--bg); stroke-width: 1.5; transition: opacity .12s; }
  .node.sel circle { stroke: var(--text); stroke-width: 2.5; }
  .node.mute { opacity: .12; }
  .node text {
    font-size: 9px; fill: var(--text); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: 2.5px;
  }
  .node.small text { display: none; }
  .node.sel text, .node.near text { display: block; font-weight: 600; }
  aside {
    width: 330px; flex: 0 0 330px; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 12px 14px;
  }
  aside h2 { font-size: 14px; margin: 0 0 6px; line-height: 1.3; }
  .tag {
    display: inline-block; background: var(--chip); border-radius: 999px;
    padding: 1px 8px; margin: 0 4px 4px 0; font-size: 11px; color: var(--muted);
  }
  .answer { white-space: pre-wrap; margin: 8px 0; }
  .meta { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
          color: var(--muted); margin: 14px 0 6px; }
  a { color: var(--accent); }
  .nb { display: block; padding: 5px 7px; margin-bottom: 4px; border-radius: 6px;
        background: var(--chip); cursor: pointer; }
  .nb:hover { outline: 1px solid var(--accent); }
  .nb .why { color: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 12px;
            border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .legend span i { display: inline-block; width: 8px; height: 8px;
                   border-radius: 50%; margin-right: 4px; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    aside { width: auto; flex: 0 0 40%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>

:sports","1 shared term"]},{"source":"3ac793c2264d814b82aad1577e3593c4","target":"3ac793c2264d81be8e63e2d8b0b3f0fc","weight":7.0,"reasons":["tag:sports","tag:baseball","1 shared term"]},{"source":"3ac793c2264d814b82aad1577e3593c4","target":"3ac793c2264d81e8b569ed44706e5b57","weight":4.0,"reasons":["tag:sports","1 shared term"]},{"source":"3ac793c2264d81be8e63e2d8b0b3f0fc","target":"3ac793c2264d81e8b569ed44706e5b57","weight":4.0,"reasons":["tag:sports","1 shared term"]},{"source":"3ac793c2264d8154ac59f8b47403fed1","target":"3ac793c2264d81b79e34fe2dbfa317b0","weight":4.0,"reasons":["tag:zen","1 shared term"]},{"source":"3ac793c2264d81f9b0d5e814a4854a87","target":"3ac793c2264d8198aa92c611d06cf1c3","weight":8.0,"reasons":["tag:geography","tag:ecology","2 shared terms"]},{"source":"3ac793c2264d81f9b0d5e814a4854a87","target":"3ac793c2264d817f8a86ce645a0d46ab","weight":10.0,"reasons":["tag:geography","tag:ecology","2 shared terms"]},{"source":"3ac793c2264d8198aa92c611d06cf1c3","target":"3ac793c2264d817f8a86ce645a0d46ab","weight":7.0,"reasons":["tag:geography","tag:ecology","1 shared term"]},{"source":"3ac793c2264d81f9b0d5e814a4854a87","target":"3ac793c2264d81d0ab13e405a2ea17dc","weight":3.0,"reasons":["tag:ecology"]},{"source":"3ac793c2264d81d0ab13e405a2ea17dc","target":"3ac793c2264d8198aa92c611d06cf1c3","weight":6.0,"reasons":["tag:ecology","3 shared terms"]},{"source":"3ac793c2264d81d0ab13e405a2ea17dc","target":"3ac793c2264d817f8a86ce645a0d46ab","weight":5.0,"reasons":["tag:ecology","2 shared terms"]},{"source":"3b0793c2264d819489f7eaec3d4326f8","target":"3ac793c2264d81e8b569ed44706e5b57","weight":2.0,"reasons":["2 shared terms"]},{"source":"3ac793c2264d810c9432dd0396397d13","target":"3ac793c2264d8106ae27c6cef5a6ca80","weight":2.0,"reasons":["2 shared terms"]}],"public":true}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('graph-data').textContent);
  var nodes = DATA.nodes, edges = DATA.edges;
  var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });

  var clusters = DATA.clusters.map(function (c) { return c.name; });
  var colorOf = {};
  clusters.forEach(function (c, i) {
    colorOf[c] = 'hsl(' + Math.round((i * 137.508) % 360) + ' 65% 58%)';
  });

  var nbr = {};
  nodes.forEach(function (n) { nbr[n.id] = []; });
  edges.forEach(function (e) {
    if (!nbr[e.source] || !nbr[e.target]) return;
    nbr[e.source].push({ id: e.target, w: e.weight, reasons: e.reasons });
    nbr[e.target].push({ id: e.source, w: e.weight, reasons: e.reasons });
  });
  Object.keys(nbr).forEach(function (k) {
    nbr[k].sort(function (a, b) { return b.w - a.w; });
  });

  var svg = document.getElementById('graph');
  var NS = 'http://www.w3.org/2000/svg';
  var view = { x: 0, y: 0, w: DATA.width, h: DATA.height };
  svg.setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' '));

  var gEdges = document.createElementNS(NS, 'g');
  var gNodes = document.createElementNS(NS, 'g');
  svg.appendChild(gEdges); svg.appendChild(gNodes);

  var edgeEls = edges.map(function (e) {
    var a = byId[e.source], b = byId[e.target];
    var ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y);
    ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
    ln.setAttribute('stroke-width', Math.min(3, 0.5 + e.weight / 4));
    ln.setAttribute('class', 'edge');
    gEdges.appendChild(ln);
    return ln;
  });

  var nodeEls = nodes.map(function (n) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node' + (n.degree < 3 ? ' small' : ''));
    g.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', Math.min(16, 5 + Math.sqrt(n.degree || 0) * 2.4));
    c.setAttribute('fill', colorOf[n.cluster] || '#888');
    g.appendChild(c);
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', 0);
    t.setAttribute('y', -Math.min(16, 5 + Math.sqrt(n.degree || 0) * 2.4) - 4);
    t.setAttribute('text-anchor', 'middle');
    t.textContent = n.title.length > 30 ? n.title.slice(0, 29) + '…' : n.title;
    g.appendChild(t);
    g.addEventListener('click', function (ev) { ev.stopPropagation(); select(n.id); });
    gNodes.appendChild(g);
    return g;
  });

  var selected = null;
  var clusterFilter = '';
  var query = '';

  function matches(n) {
    if (clusterFilter && n.cluster !== clusterFilter) return false;
    if (query) {
      var hay = (n.title + ' ' + (n.content || '') + ' ' +
                 n.tags.join(' ')).toLowerCase();
      if (hay.indexOf(query) < 0) return false;
    }
    return true;
  }

  function paint() {
    var near = {};
    if (selected) {
      near[selected] = true;
      nbr[selected].forEach(function (x) { near[x.id] = true; });
    }
    nodes.forEach(function (n, i) {
      var el = nodeEls[i];
      var ok = matches(n);
      var dim = !ok || (selected && !near[n.id]);
      el.classList.toggle('mute', !!dim);
      el.classList.toggle('sel', n.id === selected);
      el.classList.toggle('near', !!(selected && near[n.id]));
    });
    edges.forEach(function (e, i) {
      var el = edgeEls[i];
      var hot = selected && (e.source === selected || e.target === selected);
      var visible = matches(byId[e.source]) && matches(byId[e.target]);
      el.classList.toggle('hot', !!hot);
      el.classList.toggle('mute', !visible || (selected && !hot));
    });
  }

  function fmt(v, d) { return (v === null || v === undefined || v === '') ? d : v; }

  function select(id) {
    selected = id;
    var n = byId[id];
    var p = document.getElementById('panel');
    if (!n) { p.innerHTML = emptyPanel(); paint(); return; }
    var html = '<h2>' + esc(n.title) + '</h2>';
    html += '<div>' + n.tags.map(function (t) {
      return '<span class="tag">' + esc(t) + '</span>';
    }).join('') + '</div>';
    html += n.content
      ? '<div class="answer">' + esc(n.content) + '</div>'
      : '<div class="answer" style="color:var(--muted)">Answer hidden on the ' +
        'public graph. Open the card in Notion to review it.</div>';
    html += '<div class="meta">Status: ' + esc(fmt(n.status, '—')) +
            ' · Due: ' + esc(fmt(n.due, '—')) +
            ' · Reviews: ' + n.reviewCount +
            (n.retrievability !== null && n.retrievability !== undefined
              ? ' · Retrievability: ' + Math.round(n.retrievability * 100) + '%' : '') +
            '</div>';
    if (n.url) html += '<div class="meta"><a href="' + esc(n.url) +
                       '" target="_blank" rel="noopener">Open card in Notion ↗</a></div>';
    if (n.link) html += '<div class="meta"><a href="' + esc(n.link) +
                        '" target="_blank" rel="noopener">Source ↗</a></div>';
    var ns = nbr[id] || [];
    html += '<div class="sect">Connected cards (' + ns.length + ')</div>';
    ns.slice(0, 25).forEach(function (x) {
      var m = byId[x.id];
      if (!m) return;
      html += '<div class="nb" data-id="' + m.id + '">' + esc(m.short) +
              '<div class="why">' + esc(x.reasons.join(', ')) + '</div></div>';
    });
    if (!ns.length) html += '<div class="meta">No inferred connections yet.</div>';
    p.innerHTML = html;
    Array.prototype.forEach.call(p.querySelectorAll('.nb'), function (el) {
      el.addEventListener('click', function () { select(el.getAttribute('data-id')); });
    });
    p.scrollTop = 0;
    paint();
  }

  function emptyPanel() {
    return '<div class="sect">Getting started</div>' +
      '<div class="meta">Click any node to see the flashcard, its answer, and every ' +
      'card it connects to. Connected nodes stay lit; everything else dims. ' +
      'Scroll to zoom, drag to pan.</div>' +
      '<div class="sect">Biggest hubs</div>' +
      nodes.slice().sort(function (a, b) { return b.degree - a.degree; })
        .slice(0, 8).map(function (n) {
          return '<div class="nb" data-id="' + n.id + '">' + esc(n.short) +
                 '<div class="why">' + n.degree + ' connections · ' +
                 esc(n.cluster) + '</div></div>';
        }).join('');
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var sel = document.getElementById('cluster');
  sel.innerHTML = '<option value="">All topics (' + nodes.length + ')</option>' +
    DATA.clusters.map(function (c) {
      return '<option value="' + esc(c.name) + '">' + esc(c.name) +
             ' (' + c.count + ')</option>';
    }).join('');
  sel.addEventListener('change', function () { clusterFilter = sel.value; paint(); });

  document.getElementById('q').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase(); paint();
  });

  document.getElementById('stats').textContent =
    DATA.nodeCount + ' cards · ' + DATA.edgeCount + ' connections · ' +
    DATA.clusters.length + ' topics · updated ' + DATA.generatedAt.slice(0, 16).replace('T', ' ');

  document.getElementById('legend').innerHTML = DATA.clusters.map(function (c) {
    return '<span><i style="background:' + colorOf[c.name] + '"></i>' +
           esc(c.name) + '</span>';
  }).join('');

  document.getElementById('reset').addEventListener('click', function () {
    selected = null; clusterFilter = ''; query = '';
    sel.value = ''; document.getElementById('q').value = '';
    view = { x: 0, y: 0, w: DATA.width, h: DATA.height };
    applyView();
    document.getElementById('panel').innerHTML = emptyPanel();
    bindEmpty();
    paint();
  });

  function bindEmpty() {
    var p = document.getElementById('panel');
    Array.prototype.forEach.call(p.querySelectorAll('.nb'), function (el) {
      el.addEventListener('click', function () { select(el.getAttribute('data-id')); });
    });
  }

  function applyView() {
    svg.setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' '));
  }

  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var k = e.deltaY > 0 ? 1.12 : 0.89;
    var r = svg.getBoundingClientRect();
    var mx = view.x + ((e.clientX - r.left) / r.width) * view.w;
    var my = view.y + ((e.clientY - r.top) / r.height) * view.h;
    var nw = Math.max(180, Math.min(DATA.width * 3, view.w * k));
    var nh = nw * (view.h / view.w);
    view.x = mx - (mx - view.x) * (nw / view.w);
    view.y = my - (my - view.y) * (nh / view.h);
    view.w = nw; view.h = nh;
    applyView();
  }, { passive: false });

  var drag = null;
  svg.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    svg.classList.add('dragging');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var r = svg.getBoundingClientRect();
    view.x = drag.vx - (e.clientX - drag.x) * (view.w / r.width);
    view.y = drag.vy - (e.clientY - drag.y) * (view.h / r.height);
    applyView();
  });
  ['pointerup', 'pointercancel'].forEach(function (evt) {
    svg.addEventListener(evt, function () { drag = null; svg.classList.remove('dragging'); });
  });
  svg.addEventListener('click', function () { select(null); });

  document.getElementById('panel').innerHTML = emptyPanel();
  bindEmpty();
  paint();
})();
</script>
